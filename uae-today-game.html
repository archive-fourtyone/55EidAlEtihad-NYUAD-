:root{
  --ink:#101921; --night:#0b1219; --panel:#17232e; --line:#2a3946; --cream:#f4eed7; --mute:#9fb0bd;
  --red:#b72b38; --green:#388245; --teal:#019087; --deep:#316880; --sky:#7db1e0; --ice:#c3e1f4;
  --mustard:#e8c35a; --yellow:#f9d57b; --orange:#da8755;
  --head:"Oswald","Arial Narrow",sans-serif; --body:"Noto Sans",system-ui,sans-serif; --ar:"Noto Naskh Arabic",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body)}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit}
header{background:var(--cream);border-bottom:4px solid var(--red)}
header .in{max-width:520px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:16px}
header img{display:block;width:auto} header img.majlis{height:54px} header img.eid{height:34px}
header .cobar{width:1.5px;height:40px;background:var(--ink)}
.flagbar{height:6px;background:linear-gradient(90deg,var(--red) 0 25%,var(--green) 25% 50%,#fff 50% 75%,#000 75%)}
#app{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.h{font-family:var(--head);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin:0}
.ar{font-family:var(--ar);font-weight:700}
.muted{color:var(--mute)}
.bigbtn{display:block;width:100%;border:0;border-radius:16px;padding:17px;font-family:var(--head);font-size:21px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;background:var(--yellow);color:var(--ink);font-weight:600;transition:transform .08s}
.bigbtn:active{transform:scale(.98)} .bigbtn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line)}
.box{background:var(--panel);border-radius:18px;padding:16px;margin-top:16px}

/* HOME */
.hero{position:relative;border-radius:22px;overflow:hidden;padding:20px 18px 18px;background:
  radial-gradient(120% 90% at 100% 0%,rgba(1,144,135,.55),transparent 60%),
  radial-gradient(100% 80% at 0% 100%,rgba(183,43,56,.45),transparent 60%),var(--panel)}
.hero .kick{font-family:var(--head);letter-spacing:3px;font-size:12px;color:var(--yellow);text-transform:uppercase}
.hero h1{font-family:var(--head);font-size:50px;line-height:.95;margin:6px 0 2px;text-transform:uppercase}
.hero h1 b{color:var(--yellow);font-weight:600}
.hero .ar{font-size:21px;color:var(--ice);margin-bottom:8px}
.hero p{margin:0;line-height:1.5;color:#d7dee4;font-size:15px}
.sky{position:relative;margin:14px -4px 0;overflow:hidden;border-radius:12px}
.sky>svg:first-child{display:block;width:100%}
.sky .tr{position:absolute;left:0;bottom:8%;width:62%;animation:ride 7s linear infinite}
@keyframes ride{from{transform:translateX(-105%)}to{transform:translateX(165%)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px 5px 6px;background:rgba(255,255,255,.07);font-size:12.5px}
.chip b{font-family:var(--head);font-size:13px;color:#fff;background:var(--c);border-radius:999px;padding:1px 7px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.facts div{background:var(--panel);border-radius:14px;padding:10px 8px;text-align:center;font-size:12px;color:var(--mute)}
.facts b{display:block;font-family:var(--head);font-size:26px;color:var(--yellow);font-weight:600;line-height:1.1}
.lb{list-style:none;margin:10px 0 0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb .pos{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--head);font-size:14px;flex:none}
.lb li:nth-child(1) .pos{background:var(--yellow);color:var(--ink)} .lb li:nth-child(2) .pos{background:#d7dde3;color:var(--ink)} .lb li:nth-child(3) .pos{background:var(--orange);color:var(--ink)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm small{display:block;color:var(--mute);font-size:11.5px}
.lb .sc{font-family:var(--head);font-size:20px}
.lb li.me{background:rgba(249,213,123,.12);border-radius:10px}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:22px;line-height:1.5}

/* RIDE */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.quit{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);font-size:18px;cursor:pointer;flex:none}
.score{font-family:var(--head);font-size:22px;color:var(--yellow);min-width:70px;text-align:right}
.route{position:relative;flex:1;display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px}
.route:before{content:"";position:absolute;left:12px;right:12px;top:9px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,#5b6a76 0 6px,transparent 6px 10px)}
.rs{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:26px}
.rs i{display:block;width:12px;height:12px;margin-top:5px;border-radius:50%;background:var(--night);border:3px solid #3a4b58}
.rs span{font-family:var(--head);font-size:9.5px;color:#5b6a76;letter-spacing:.3px}
.rs.done i{background:var(--c);border-color:var(--c)} .rs.done span{color:var(--mute)}
.rs.cur i{width:20px;height:20px;margin-top:1px;background:var(--c);border-color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 40%,transparent)}
.rs.cur span{color:#fff}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--panel);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;touch-action:none}
.hud{display:flex;align-items:center;justify-content:space-between;font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:15px;margin:10px 4px 6px}
.hud .gname{color:var(--mute)}
.tbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--c,var(--teal));transform-origin:left;border-radius:8px}

/* overlays inside the stage */
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column}
.splash{padding:18px 18px 16px;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#000) 0%,color-mix(in srgb,var(--c) 55%,#0b1219) 55%,rgba(11,18,25,.97) 100%);animation:fadein .25s both}
.splash .row{display:flex;justify-content:space-between;align-items:center}
.tagp{font-family:var(--head);font-size:12px;letter-spacing:2px;text-transform:uppercase;background:rgba(0,0,0,.25);border-radius:999px;padding:4px 10px}
.splash .yr{font-family:var(--head);font-size:112px;line-height:.9;font-weight:600;margin-top:14px;letter-spacing:-1px;text-shadow:0 6px 0 rgba(0,0,0,.18);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.splash .hd{font-family:var(--head);text-transform:uppercase;font-size:30px;line-height:1.02;margin:6px 0 10px;animation:up .45s .1s both}
.splash .ar2{font-family:var(--ar);font-size:18px;opacity:.85;margin-top:-4px;animation:up .45s .15s both}
.splash p{margin:10px 0 0;font-size:15.5px;line-height:1.5;color:rgba(255,255,255,.93);animation:up .45s .2s both}
.splash .ico{position:absolute;right:16px;top:58px;width:96px;height:96px;opacity:.22}
.splash .go{margin-top:auto;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:18px;padding:10px 10px 10px 14px}
.splash .go .how{flex:1;font-size:13.5px;line-height:1.35;color:#e6edf2}
.splash .go .how b{display:block;font-family:var(--head);font-size:20px;letter-spacing:1px;color:var(--yellow)}
.gobtn{position:relative;flex:none;width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;background:var(--yellow);color:var(--ink);font-family:var(--head);font-size:24px;letter-spacing:1px;font-weight:600}
.gobtn svg{position:absolute;inset:-5px;width:94px;height:94px;transform:rotate(-90deg)}
.gobtn circle{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:ring 7s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.verb{align-items:center;justify-content:center;background:rgba(11,18,25,.35);pointer-events:none}
.verb b{font-family:var(--head);font-size:56px;color:#fff;text-transform:uppercase;text-align:center;line-height:1;padding:0 16px;text-shadow:0 5px 0 var(--c),0 0 30px rgba(0,0,0,.5);animation:zoom .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes zoom{0%{transform:scale(2.4) rotate(-6deg);opacity:0}30%{transform:scale(1) rotate(-3deg);opacity:1}80%{opacity:1}100%{transform:scale(.9) rotate(-3deg);opacity:0}}
.res{align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(80% 60% at 50% 40%,color-mix(in srgb,var(--c) 60%,transparent),rgba(11,18,25,.94));animation:fadein .2s both}
.res .k{font-family:var(--head);letter-spacing:2.5px;font-size:13px;text-transform:uppercase;color:var(--yellow)}
.res .t{font-family:var(--head);text-transform:uppercase;font-size:26px;line-height:1.05;margin:6px 0 2px}
.res .msg{font-size:15px;color:#dfe6ea}
.res .st{font-size:34px;letter-spacing:6px;color:var(--yellow);margin:8px 0 0}
.res .st .off{color:rgba(255,255,255,.2)}
.res .pts{font-family:var(--head);font-size:48px;line-height:1;margin-top:2px}
.res .cars{display:flex;justify-content:center;align-items:flex-end;width:100%;max-width:300px;margin:14px auto 16px}
.res .cars svg{width:50%;display:block}
.res .cars svg.loco{width:44%}
.res .cars .fresh{animation:couple .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes couple{0%{transform:translateX(150%);opacity:0}70%{transform:translateX(-4%)}100%{transform:none;opacity:1}}
.res .bigbtn{max-width:280px}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}

/* FINALE */
.fin{border-radius:22px;padding:20px 16px;background:radial-gradient(120% 80% at 50% 0%,rgba(249,213,123,.25),transparent 60%),linear-gradient(160deg,#1f5c4d,#123a33);border:2px solid #2d7a66;text-align:center}
.fin .k{font-family:var(--head);letter-spacing:3px;font-size:12px;color:var(--yellow);text-transform:uppercase}
.fin h2{font-family:var(--head);font-size:36px;text-transform:uppercase;margin:4px 0 2px;line-height:1}
.fin .n{font-family:var(--head);font-size:76px;line-height:.9;color:var(--yellow);margin-top:10px}
.fin .rk{font-family:var(--head);text-transform:uppercase;font-size:20px;letter-spacing:1px}
.train{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:16px;padding:12px 4px 6px;background:rgba(0,0,0,.2);border-radius:16px}
.train .slot{width:33.33%;text-align:center}
.train svg{width:100%;display:block}
.train .nm{font-family:var(--head);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;color:rgba(255,255,255,.75);margin-top:1px}
.save{display:flex;gap:8px;margin-top:10px}
.save input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--night);color:var(--cream);border-radius:12px;padding:12px;font:inherit;font-size:16px}
.save button{border:0;border-radius:12px;background:var(--yellow);color:var(--ink);font-family:var(--head);text-transform:uppercase;letter-spacing:1px;padding:0 18px;cursor:pointer;font-size:16px}
.save button:disabled{opacity:.5}
.tl{position:relative;margin-top:6px;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--red),var(--green))}
.tli{position:relative;background:var(--panel);border-radius:14px;padding:11px 12px;margin-top:10px}
.tli:before{content:"";position:absolute;left:-21px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--c);border:3px solid var(--night)}
.tli .y{font-family:var(--head);font-size:22px;color:var(--c);line-height:1}
.tli .y small{font-size:13px;color:var(--yellow);letter-spacing:2px;margin-left:8px}
.tli .hd{font-family:var(--head);text-transform:uppercase;font-size:17px;margin:3px 0 4px;line-height:1.1}
.tli p{margin:0;font-size:13.5px;line-height:1.45;color:#cfd8df}
.stack{display:grid;gap:10px;margin-top:16px}
</style>
</head>

const lb = {
  all(){ return LBC; },
  async refresh(){
    if(!SHARED) return false;
    await lb.flush();

      const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(SCORES_URL+'?game='+GAME+'&t='+Date.now(),{signal:ctl.signal}); clearTimeout(to);
      const a=await r.json(); if(!Array.isArray(a)) return false;
      const pend=ls.get(PEND_KEY,[]);
      LBC=sortLb(a.filter(e=>e&&typeof e.n==='string'&&isFinite(e.s)).map(e=>({n:String(e.n).slice(0,16),s:+e.s,r:String(e.r||'').slice(0,30),t:+e.t||0}))
        .concat(pend.filter(p=>!a.some(e=>+e.t===p.t&&e.n===p.n)))).slice(0,50);
      ls.set(LB_KEY,LBC); return true;
    }catch(e){ return false; }

  async send(e){
    try{ const r=await fetch(SCORES_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({g:GAME},e))});
      const j=await r.json(); return !!(j&&j.ok); }catch(_){ return false; }
  },
  async flush(){ const pend=ls.get(PEND_KEY,[]); if(!pend.length) return; const left=[];
    for(const p of pend){ if(!(await lb.send(p))) left.push(p); } ls.set(PEND_KEY,left); },

  }

function canvas(st,W,H){ const c=document.createElement('canvas'), dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=W*dpr; c.height=H*dpr; c.style.aspectRatio=W+'/'+H; st.appendChild(c); const x=c.getContext('2d'); x.scale(dpr,dpr);
  return {c,x,W,H,pos(e){ const b=c.getBoundingClientRect(); return [(e.clientX-b.left)/b.width*W,(e.clientY-b.top)/b.height*H]; }}; }
const rr=(x,X,Y,w,h,r)=>{ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); };
const on=(el,ev,fn,opt)=>{ el.addEventListener(ev,fn,opt); return ()=>el.removeEventListener(ev,fn,opt); };
const loopOf=fn=>{ let raf, last=performance.now(), dead=false; const L=now=>{ if(dead) return; const dt=Math.min(.05,(now-last)/1000); last=now; fn(dt); raf=requestAnimationFrame(L); }; raf=requestAnimationFrame(L); return ()=>{ dead=true; cancelAnimationFrame(raf); }; };
function pops(){ const a=[]; return { add(x,y,t,c='#fff',sz=22){ a.push({x,y,t,c,sz,life:.9}); }, draw(g,dt){ for(let i=a.length-1;i>=0;i--){ const p=a[i]; p.life-=dt; p.y-=40*dt; if(p.life<=0){ a.splice(i,1); continue; }
  g.globalAlpha=Math.min(1,p.life*2); g.font=`600 ${p.sz}px Oswald,sans-serif`; g.textAlign='center'; g.lineWidth=5; g.strokeStyle=C.ink; g.strokeText(p.t,p.x,p.y); g.fillStyle=p.c; g.fillText(p.t,p.x,p.y); g.globalAlpha=1; } } }; }
function fx(){ const P=[]; return { burst(x,y,cols,n=20,sp=240){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=rnd(.3,1)*sp; P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:rnd(.5,1.1),c:cols[i%cols.length],s:rnd(2.5,5.5),r:rnd(0,6)}); } },
  draw(g,dt,grav=460){ for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.l-=dt; if(p.l<=0){ P.splice(i,1); continue; } p.vy+=grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=dt*8;
    g.save(); g.globalAlpha=Math.min(1,p.l*2); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); g.restore(); } } }; }

    g.fillStyle=ink; g.beginPath(); g.arc(30,-70,2,0,7); g.fill(); g.beginPath(); g.ellipse(14,-68,3,4.5,0,0,7); g.fillStyle=skin; g.fill(); g.stroke();
    g.restore(); };
  const stopL=loopOf(dt=>{ t+=dt; lock=Math.max(0,lock-dt);
    // arena
    const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0a0f16'); bg.addColorStop(1,'#16212c'); g.fillStyle=bg; g.fillRect(0,0,W,H);
    g.save(); g.globalAlpha=.12; g.fillStyle='#fff8dc'; [[60,0],[180,0],[300,0]].forEach(([x])=>{ g.beginPath(); g.moveTo(x-12,0); g.lineTo(x+12,0); g.lineTo(x+70,320); g.lineTo(x-70,320); g.fill(); }); g.restore();
    g.fillStyle='#1c2732'; g.fillRect(0,88,W,46); crowd.forEach(([x,y,c])=>{ g.fillStyle=c; g.globalAlpha=.7; g.beginPath(); g.arc(x,y+Math.sin(t*5+x)*1.2,3.2,0,7); g.fill(); }); g.globalAlpha=1;
    g.fillStyle='#b72b38'; g.fillRect(0,134,W,22); g.fillStyle='#fff'; g.font='600 12px Oswald,sans-serif'; g.textAlign='center'; g.fillText('ABU DHABI · JIU-JITSU WORLD CHAMPIONSHIP 2026',W/2,149);
    // mat in perspective
    g.fillStyle='#e8c35a'; g.beginPath(); g.moveTo(10,350); g.lineTo(W-10,350); g.lineTo(W-50,226); g.lineTo(50,226); g.closePath(); g.fill();
    g.fillStyle='#2f6aa8'; g.beginPath(); g.moveTo(30,342); g.lineTo(W-30,342); g.lineTo(W-64,232); g.lineTo(64,232); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,255,255,.12)'; g.lineWidth=1.5; for(let k=1;k<4;k++){ g.beginPath(); g.moveTo(30+k*75,342); g.lineTo(64+k*58,232); g.stroke(); } g.beginPath(); g.moveTo(46,288); g.lineTo(W-46,288); g.stroke();
    // fighters with move animation
    let a1=0,a2=0,r1=0,dx1=0,dy1=0,dx2=0;
    if(act){ act.l-=dt; const k=Math.max(0,act.l)/.32, e=Math.sin(k*Math.PI);
      if(act.k==='R'){ dx1=18*e; a2=-.55*e; dx2=26*e; } else if(act.k==='L'){ dx1=8*e; a2=.5*e; dy1=6*e; } else if(act.k==='U'){ dy1=-22*e; dx1=14*e; } else { r1=1.2*e; dx2=-6*e; }
      if(act.l<=0) act=null; }
    g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(128,318,48,8,0,0,7); g.ellipse(236,318,48,8,0,0,7); g.fill();
    fighter(236+dx2,262,-1,'#2f6aa8','#1d4f84','#7b4fa0','#c98b6a','#3a2618',a2,.2);
    fighter(124+dx1,262+dy1,1,'#f4f1ea','#d8d2c4',medals>=10?'#101921':medals>=6?'#7a4a2a':medals>=3?'#7b4fa0':'#2f6aa8','#d9a37c','#101921',a1,r1);
    // move prompt
    const k0=q[0]; g.fillStyle=lock>0?'#b72b38':'#f9d57b'; g.beginPath(); g.arc(W/2,52,34,0,7); g.fill(); g.strokeStyle='#101921'; g.lineWidth=3; g.stroke(); arrow(W/2,52,DIR[k0].a,22,'#101921');
    g.fillStyle='#fff'; g.font='600 13px Oswald,sans-serif'; g.textAlign='center'; g.fillText(DIR[k0].n.toUpperCase(),W/2,100);
    q.slice(1).forEach((k,j)=>{ g.fillStyle='rgba(255,255,255,.16)'; g.beginPath(); g.arc(W/2+66+j*40,52,15,0,7); g.fill(); arrow(W/2+66+j*40,52,DIR[k].a,10,'rgba(255,255,255,.75)'); });

    KEYS.forEach(k=>{ const [x,y]=BTN[k], hot=k===k0; const gr=g.createLinearGradient(0,y-28,0,y+28); gr.addColorStop(0,hot?'#ffe7a0':'#3a4b58'); gr.addColorStop(1,hot?'#e8b84a':'#23303b'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,28,0,7); g.fill(); g.strokeStyle=hot?'#fff':'#101921'; g.lineWidth=2.5; g.stroke(); arrow(x,y,DIR[k].a,17,hot?'#101921':'#c3e1f4'); });
    F.draw(g,dt); P.draw(g,dt); });
  return { start(){ started=true; }, score:()=>clamp(Math.round(ok*100/NEED)-wrong*4,0,100), stop(){ stopL(); offs.forEach(o=>o()); } };
};

/* 8. HOPE PROBE: launch window — time the launch so the probe meets Mars */
GAMES.hope=(K,api)=>{
  const g=K.x, SX=W/2, SY=252, RE=74, RM=148, WE=3.0, WM=.72, SPD=230;
  let started=false, t=0, aE=rnd(0,6.28), aM=rnd(0,6.28), probe=null, res=[], trail=[], flash=0, msgT=0; const P=pops(), F=fx();
  const stars=[...Array(110)].map(()=>[rnd(0,W),rnd(0,H),rnd(.4,1.8),rnd(0,6)]);
  const launch=()=>{ if(!started||probe||res.length>=3) return; probe={a:aE,r:RE+8}; trail=[]; beep(220,.25,'sawtooth',.05); setTimeout(()=>beep(440,.15,'triangle'),120); };
  const offs=[on(K.c,'pointerdown',e=>{ e.preventDefault(); launch(); }), on(window,'keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); launch(); } })];
  api.hud('Launch 1 of 3');
  const pos=(a,r)=>[SX+Math.cos(a)*r,SY+Math.sin(a)*r];
  const stopL=loopOf(dt=>{ t+=dt; flash=Math.max(0,flash-dt);
    aE+=WE*dt; aM+=WM*dt;
    if(probe){ probe.r+=SPD*dt; trail.push(pos(probe.a,probe.r)); if(trail.length>26) trail.shift();
      if(probe.r>=RM&&!probe.done){ probe.done=true; let d=Math.abs(((probe.a-aM)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI)*RM; const [mx,my]=pos(aM,RM);
        let sc, m, col; if(d<=18){ sc=100; m='MARS ORBIT! 🎉'; col=C.yellow; good(); F.burst(mx,my,CONF,26,240); flash=.25; } else if(d<=44){ sc=60; m='So close!'; col='#fff'; beep(600,.1,'triangle'); } else { sc=0; m='Missed Mars!'; col=C.red; bad(); }
        res.push(sc); P.add(SX,SY-RM-22<40?60:SY-RM-22,m,col,26); api.hud(res.length<3?`Launch ${res.length+1} of 3`:'Mission complete');
        if(sc>0) probe.hitM=true; if(res.length>=3) setTimeout(()=>api.win(),700); }
      if(probe.hitM&&probe.done){ probe.r=RM; probe.a=aM+.16; }
      if(probe.r>RM+180||(probe.hitM&&probe.done&&(probe.t=(probe.t||0)+dt)>.6)) probe=null; }
    // space
    g.fillStyle='#04060d'; g.fillRect(0,0,W,H);
    stars.forEach(s=>{ g.fillStyle=`rgba(255,255,255,${.35+.35*Math.sin(t*2+s[3])})`; g.fillRect(s[0],s[1],s[2],s[2]); });
    const neb=g.createRadialGradient(60,80,10,60,80,220); neb.addColorStop(0,'rgba(123,79,160,.28)'); neb.addColorStop(1,'rgba(123,79,160,0)'); g.fillStyle=neb; g.fillRect(0,0,W,H);
    // sun
    const sg=g.createRadialGradient(SX,SY,4,SX,SY,60); sg.addColorStop(0,'#fff8d6'); sg.addColorStop(.35,'#f9d57b'); sg.addColorStop(1,'rgba(249,213,123,0)'); g.fillStyle=sg; g.beginPath(); g.arc(SX,SY,60,0,7); g.fill();
    g.fillStyle='#ffd36a'; g.beginPath(); g.arc(SX,SY,20,0,7); g.fill();
    // orbits
    g.setLineDash([3,6]); g.strokeStyle='rgba(125,177,224,.35)'; g.lineWidth=1.5; g.beginPath(); g.arc(SX,SY,RE,0,7); g.stroke(); g.strokeStyle='rgba(240,138,93,.35)'; g.beginPath(); g.arc(SX,SY,RM,0,7); g.stroke(); g.setLineDash([]);
    // aim line from Earth to Mars orbit
    const [ex,ey]=pos(aE,RE), [ax,ay]=pos(aE,RM);
    if(!probe&&started&&res.length<3){ g.strokeStyle='rgba(249,213,123,.55)'; g.lineWidth=2; g.setLineDash([6,6]); g.beginPath(); g.moveTo(ex,ey); g.lineTo(ax,ay); g.stroke(); g.setLineDash([]); g.strokeStyle='#f9d57b'; g.beginPath(); g.arc(ax,ay,9,0,7); g.stroke(); }
    // mars
    const [mx,my]=pos(aM,RM); const mg=g.createRadialGradient(mx-5,my-5,2,mx,my,18); mg.addColorStop(0,'#f6a072'); mg.addColorStop(1,'#a4422a'); g.fillStyle=mg; g.beginPath(); g.arc(mx,my,17,0,7); g.fill();
    g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.arc(mx+5,my+3,4,0,7); g.arc(mx-6,my-5,3,0,7); g.fill(); g.fillStyle='#f0b08a'; g.font='600 12px Oswald,sans-serif'; g.textAlign='center'; g.fillText('MARS',mx,my+32);
    // earth
    g.fillStyle='#2f6aa8'; g.beginPath(); g.arc(ex,ey,12,0,7); g.fill(); g.fillStyle='#388245'; g.beginPath(); g.ellipse(ex-3,ey-2,6,4,.5,0,7); g.fill(); g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.ellipse(ex+4,ey+5,5,2,0,0,7); g.fill();
    g.fillStyle='#c3e1f4'; g.font='600 11px Oswald,sans-serif'; g.fillText('EARTH',ex,ey+26);
    // probe + trail
    if(probe){ trail.forEach(([x,y],i)=>{ g.fillStyle=`rgba(249,213,123,${i/trail.length*.8})`; g.beginPath(); g.arc(x,y,2+i/trail.length*2,0,7); g.fill(); });
      const [px,py]=pos(probe.a,probe.r); g.save(); g.translate(px,py); g.rotate(probe.a);
      g.fillStyle='#316880'; g.fillRect(-3,-16,6,10); g.fillRect(-3,6,6,10); g.fillStyle='#e8c35a'; g.beginPath(); for(let j=0;j<6;j++){ const a=j/6*Math.PI*2; g.lineTo(Math.cos(a)*7,Math.sin(a)*7); } g.closePath(); g.fill(); g.strokeStyle='#101921'; g.lineWidth=1.5; g.stroke(); g.restore(); }
    // result pips + label
    for(let k=0;k<3;k++){ const r=res[k]; g.fillStyle=r==null?'rgba(255,255,255,.18)':r>=90?'#f9d57b':r>0?'#fff':'#b72b38'; g.beginPath(); g.arc(28+k*24,30,8,0,7); g.fill(); }
    g.fillStyle='#fff'; g.font='600 14px Oswald,sans-serif'; g.textAlign='right'; g.fillText('HOPE PROBE · LAUNCH WINDOW',W-14,35);
    if(started&&!res.length&&!probe){ g.fillStyle='#f9d57b'; g.font='600 16px Oswald,sans-serif'; g.textAlign='center'; g.globalAlpha=.6+.4*Math.sin(t*7); g.fillText('TAP WHEN MARS IS ABOUT TO REACH THE GOLD CIRCLE',W/2,H-22); g.globalAlpha=1; }
    if(flash>0){ g.fillStyle=`rgba(255,240,200,${flash})`; g.fillRect(0,0,W,H); }
    F.draw(g,dt,120); P.draw(g,dt); });
  return { start(){ started=true; }, score:()=>Math.round(res.reduce((a,b)=>a+b,0)/3), stop(){ stopL(); offs.forEach(o=>o()); } };
};
